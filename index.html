<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>킴스클럽 야탑점 실적 공유</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{--bg:#0f1220;--card:#1b1f31;--card2:#232841;--hover:#2c3354;--line:#2e3454;--text:#eef1ff;--muted:#9aa3c7;--accent:#5b7cfa;--accent2:#4c6ef5;--danger:#ff5d6c;--headerbg:rgba(15,18,32,.92);--imgbg:#0a0d18;--shadow:rgba(0,0,0,.45);}
  body.light{--bg:#eef1f7;--card:#ffffff;--card2:#f1f4fa;--hover:#e6ebf6;--line:#dde3ef;--text:#1b2030;--muted:#5f6782;--accent:#4c6ef5;--accent2:#4263eb;--danger:#e03d4d;--headerbg:rgba(255,255,255,.92);--imgbg:#e9edf5;--shadow:rgba(80,100,160,.18);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",system-ui,sans-serif;letter-spacing:-0.01em;transition:background .25s,color .25s;}
  body{padding-bottom:90px;}
  header{position:sticky;top:0;z-index:30;background:var(--headerbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;}
  .titlebar{display:flex;align-items:center;gap:10px;}
  .titlebar h1{font-size:17px;margin:0;flex:1;}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s,transform .1s;}
  .iconbtn:hover{background:var(--hover);border-color:var(--accent);}
  .iconbtn:active{transform:scale(.93);}
  .daterow{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .daterow input[type=date]{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:12px;font-size:16px;}
  .navbtn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:0 14px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;}
  .navbtn:hover{background:var(--hover);border-color:var(--accent);}
  .navbtn:active{transform:scale(.93);}
  .todaybtn{background:var(--accent2);border:none;color:#fff;padding:0 14px;height:44px;border-radius:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .15s,transform .1s;}
  .todaybtn:hover{filter:brightness(1.12);}
  .todaybtn:active{transform:scale(.96);}
  main{padding:16px;max-width:920px;margin:0 auto;}
  .status{color:var(--muted);font-size:13px;padding:8px 2px 14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .photo{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .1s;}
  .photo:hover{border-color:#3a4570;}
  .photo{box-shadow:0 2px 8px var(--shadow);}
  .photo .imgwrap{aspect-ratio:1/1;background:var(--imgbg);display:grid;place-items:center;cursor:zoom-in;overflow:hidden;}
  .photo .imgwrap img{width:100%;height:100%;object-fit:cover;transition:transform .25s;}
  .photo .imgwrap:hover img{transform:scale(1.05);}
  .photo .meta{padding:8px 10px;font-size:12px;}
  .photo .who{font-weight:700;}
  .photo .time{color:var(--muted);}
  .photo .memo{color:var(--muted);margin-top:3px;word-break:break-all;}
  .photo .row{display:flex;gap:6px;padding:0 10px 10px;}
  .photo .row button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,border-color .15s;}
  .photo .row button:hover{background:var(--hover);border-color:var(--accent);}
  .photo .row button.del{color:var(--danger);}
  .photo .row button.del:hover{border-color:var(--danger);}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;}
  .empty .big{font-size:44px;}
  .fab{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--accent);color:#fff;border:none;width:60px;height:60px;border-radius:20px;font-size:30px;box-shadow:0 10px 26px rgba(91,124,250,.45);cursor:pointer;transition:filter .15s,transform .12s,box-shadow .15s;}
  .fab:hover{filter:brightness(1.1);transform:translateY(-3px);box-shadow:0 14px 30px rgba(91,124,250,.55);}
  .fab:active{transform:scale(.94);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 18px 28px;max-height:92vh;overflow-y:auto;}
  @media(min-width:600px){.overlay{align-items:center;}.sheet{border-radius:20px;}}
  .sheet h2{margin:4px 0 16px;font-size:18px;}
  label.fld{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
  select,input[type=text],input[type=email],textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:11px;font-size:16px;}
  textarea{resize:vertical;min-height:56px;}
  .btn{width:100%;background:var(--accent);border:none;color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;transition:filter .15s,transform .1s;}
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5;}
  .btn.ghost{background:transparent;color:var(--muted);margin-top:8px;}
  .btn.ghost:hover{color:var(--text);filter:none;}
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .tag{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 10px 6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .tag .x{color:var(--danger);cursor:pointer;font-weight:700;}
  .tag .x:hover{transform:scale(1.2);}
  .addrow{display:flex;gap:8px;margin-top:8px;}
  .addrow input{flex:1;}
  .addrow button{background:var(--accent2);border:none;color:#fff;padding:0 16px;border-radius:11px;cursor:pointer;transition:filter .15s;}
  .addrow button:hover{filter:brightness(1.12);}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .pastezone{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-top:6px;background:var(--card2);}
  .pastezone.drag{border-color:var(--accent);background:#20264a;}
  .pzbtns{display:flex;gap:10px;}
  .pickbtn{flex:1;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,filter .15s,background .15s,box-shadow .15s,border-color .15s;}
  .pickbtn:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 6px 16px rgba(91,124,250,.35);}
  .pickbtn:active{transform:scale(.97);box-shadow:none;}
  .pickbtn.alt{background:var(--card);border:1px solid var(--line);color:var(--text);}
  .pickbtn.alt:hover{background:var(--hover);border-color:var(--accent);filter:none;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .pzhint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}
  .preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .preview .thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .preview .thumb img{width:100%;height:100%;object-fit:cover;}
  .preview .thumb .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;}
  .preview .cnt{align-self:center;color:var(--muted);font-size:13px;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:80;background:#000;color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:.95;}
  /* 뷰어 */
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:60;display:none;flex-direction:column;}
  .viewer.show{display:flex;}
  .viewer .vtop{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));}
  .viewer .vleft,.viewer .vright{display:flex;align-items:center;gap:8px;}
  .viewer .vleft{margin-right:auto;}
  .viewer .vtop button{background:rgba(255,255,255,.14);color:#fff;border:none;height:40px;min-width:40px;padding:0 12px;border-radius:11px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s;}
  .viewer .vtop button:hover{background:rgba(255,255,255,.28);}
  .viewer .vtop button:active{transform:scale(.93);}
  .viewer .vtop .zpct{color:#fff;font-size:14px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}
  .viewer .vtop svg{display:block;}
  @media(max-width:560px){
    .viewer .vtop{gap:6px;padding:8px;}
    .viewer .vtop button{height:38px;min-width:38px;padding:0 9px;font-size:14px;}
    .viewer .vtop .zpct{min-width:46px;font-size:13px;}
    .viewer .vtop .txt{display:none;} /* 모바일에선 글자 숨기고 아이콘만 */
  }
  .viewer .vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;touch-action:none;}
  .viewer img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform;}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite;}
  @keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>📸 킴스클럽 야탑점 실적 공유</h1>
    <button class="iconbtn" id="btnTheme" title="다크/일반 모드">☀️</button>
    <button class="iconbtn" id="btnRefresh" title="새로고침">⟳</button>
    <button class="iconbtn" id="btnSettings" title="설정">⚙️</button>
  </div>
  <div class="daterow">
    <button class="navbtn" id="btnPrev">‹</button>
    <input type="date" id="datePicker" />
    <button class="navbtn" id="btnNext">›</button>
    <button class="todaybtn" id="btnToday">오늘</button>
  </div>
</header>

<main>
  <div class="status" id="status">불러오는 중…</div>
  <div class="grid" id="grid"></div>
</main>

<button class="fab" id="btnUpload">＋</button>

<div class="overlay" id="uploadOverlay">
  <div class="sheet">
    <h2>사진 업로드</h2>
    <label class="fld">날짜</label>
    <input type="date" id="upDate" />
    <label class="fld">담당자</label>
    <select id="upMember"></select>
    <label class="fld">메모 (선택)</label>
    <input type="text" id="upMemo" placeholder="예: 오전 점검, 매장 진열 등" />
    <label class="fld">사진 / 캡쳐 선택 (여러 장 가능)</label>
    <input type="file" id="upFile" accept="image/*" multiple hidden />
    <div class="pastezone" id="pasteZone">
      <div class="pzbtns">
        <button type="button" class="pickbtn" id="btnPick">📁 파일에서 선택</button>
        <button type="button" class="pickbtn alt" id="btnPaste">📋 붙여넣기</button>
      </div>
      <div class="pzhint">캡쳐한 뒤 여기를 클릭하고 <b>Ctrl+V</b> 로 붙여넣을 수 있어요.</div>
      <div class="preview" id="upPreview"></div>
    </div>
    <button class="btn" id="btnDoUpload">업로드</button>
    <button class="btn ghost" id="btnCancelUpload">취소</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>⚙️ 설정</h2>
    <label class="fld">담당자 이름 목록</label>
    <div class="tagrow" id="memberTags"></div>
    <div class="addrow"><input type="text" id="newMember" placeholder="이름 추가" /><button id="btnAddMember">추가</button></div>
    <label class="fld" style="margin-top:18px;">알림 수신 이메일</label>
    <div class="tagrow" id="emailTags"></div>
    <div class="addrow"><input type="email" id="newEmail" placeholder="email@example.com" /><button id="btnAddEmail">추가</button></div>
    <div class="hint">담당자·이메일은 구글시트에 저장되어 모두에게 공유됩니다. 사진이 올라오면 자동으로 알림 메일이 발송돼요.</div>
    <button class="btn" id="btnSaveConfig">저장</button>
    <button class="btn ghost" id="btnCloseSettings">닫기</button>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="vtop">
    <div class="vleft">
      <button class="zb" id="btnZoomOut" title="축소">－</button>
      <span id="zoomPct" class="zpct">100%</span>
      <button class="zb" id="btnZoomIn" title="확대">＋</button>
      <button id="btnZoomReset" title="원본 크기">⟲<span class="txt"> 원본</span></button>
    </div>
    <div class="vright">
      <button id="btnViewerDownload" title="다운로드">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>
        <span class="txt">다운로드</span>
      </button>
      <button id="btnViewerClose" title="닫기">✕</button>
    </div>
  </div>
  <div class="vbody" id="viewerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== 본인 Apps Script 웹앱 주소 ====== */
var API_URL = "https://script.google.com/macros/s/AKfycbwOeV0-NbBhMyntI_lulP-2lRcTEvYri0s8RVC-6HMP77EvZ66OnxzDXUnsH64G9ICLWQ/exec";
var SETTINGS_PW = "1234";   // 설정 진입 비밀번호 (삭제는 비번 없이 가능)
var settingsUnlocked = false;

var DL_SVG = "<svg viewBox='0 0 24 24' width='15' height='15' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v11'/><path d='M8 11l4 4 4-4'/><path d='M5 20h14'/></svg>";

var cfg = { members: [], recipients: [] };
var pendingFiles = [];

// ---- API ----
function apiReady(){ return API_URL.indexOf('script.google.com') >= 0; }
function apiGet(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  return fetch(API_URL+'?'+qs).then(function(r){return r.json();}).then(function(j){ if(j&&j.error) throw new Error(j.error); return j; });
}
function apiPost(payload){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.error) throw new Error(j.error); return j; });
}
function thumbUrl(id){ return 'https://drive.google.com/thumbnail?id='+id+'&sz=w300'; }
function bigUrl(id){ return 'https://lh3.googleusercontent.com/d/'+id+'=w2048'; }
function dlUrl(id){ return 'https://drive.google.com/uc?export=download&id='+id; }

function toast(msg,ms){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},ms||2500);}
function todayStr(){var d=new Date();var off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10);}
function pad(n){return String(n).padStart(2,'0');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function openOverlay(id){document.getElementById(id).classList.add('show');}
function closeOverlay(id){document.getElementById(id).classList.remove('show');}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ---- 설정 ----
function loadConfig(){
  return apiGet({action:'config'}).then(function(c){ cfg.members=c.members||[]; cfg.recipients=c.recipients||[]; lsSet('ps_config',cfg); });
}
function fillMemberSelect(){
  var sel=document.getElementById('upMember');
  sel.innerHTML=cfg.members.length?cfg.members.map(function(m){return '<option>'+escapeHtml(m)+'</option>';}).join(''):'<option value="">설정에서 담당자를 추가하세요</option>';
  var saved=localStorage.getItem('ps_member');
  if(saved&&cfg.members.indexOf(saved)>=0) sel.value=saved;   // 기기별 담당자 기억
}
function renderTags(){
  var mt=document.getElementById('memberTags');mt.innerHTML='';
  cfg.members.forEach(function(m,idx){var el=document.createElement('div');el.className='tag';el.innerHTML='<b>'+escapeHtml(m)+'</b> <span class="x">✕</span>';el.querySelector('.x').onclick=function(){cfg.members.splice(idx,1);renderTags();};mt.appendChild(el);});
  var et=document.getElementById('emailTags');et.innerHTML='';
  cfg.recipients.forEach(function(m,idx){var el=document.createElement('div');el.className='tag';el.innerHTML='<b>'+escapeHtml(m)+'</b> <span class="x">✕</span>';el.querySelector('.x').onclick=function(){cfg.recipients.splice(idx,1);renderTags();};et.appendChild(el);});
}

// ---- 목록 ----
function emptyHtml(){ return '<div class="empty"><div class="big">🗓️</div><p>이 날짜에 등록된 사진이 없습니다.<br>＋ 버튼으로 추가하세요.</p></div>'; }
function renderPhotos(photos){
  var grid=document.getElementById('grid');grid.innerHTML='';
  if(!photos.length){grid.innerHTML=emptyHtml();return;}
  photos.forEach(function(p){
    var memo=(p.memo && !/^\d{4}-\d{2}-\d{2}T/.test(String(p.memo)))?String(p.memo):'';   // 잘못 변환된 날짜값 숨김
    var card=document.createElement('div');card.className='photo';
    card.innerHTML='<div class="imgwrap"><img src="'+thumbUrl(p.fileId)+'" loading="lazy" referrerpolicy="no-referrer" /></div>'+
      '<div class="meta"><div class="who">'+escapeHtml(p.uploader||'(미상)')+'</div><div class="time">'+escapeHtml(p.time||'')+'</div>'+(memo?'<div class="memo">'+escapeHtml(memo)+'</div>':'')+'</div>'+
      '<div class="row"><button class="dl">'+DL_SVG+' 저장</button><button class="del">삭제</button></div>';
    grid.appendChild(card);
    card.querySelector('.imgwrap').onclick=function(){openViewer(p);};
    card.querySelector('.dl').onclick=function(){window.open(dlUrl(p.fileId),'_blank');};
    card.querySelector('.del').onclick=function(){deletePhoto(p);};
  });
}
function render(){
  var status=document.getElementById('status');
  if(!apiReady()){ status.textContent='⚠️ 설정 필요: API_URL에 Apps Script 주소를 넣으세요.'; document.getElementById('grid').innerHTML=''; return; }
  var date=document.getElementById('datePicker').value;
  var cached=lsGet('ps_list_'+date);
  if(cached){ renderPhotos(cached); status.textContent=date+' · 사진 '+cached.length+'장'; }   // 캐시 즉시 표시
  else { status.textContent='불러오는 중…'; document.getElementById('grid').innerHTML='<div class="empty"><div class="spin" style="margin:0 auto"></div></div>'; }
  apiGet({action:'list',date:date}).then(function(photos){
    lsSet('ps_list_'+date,photos);
    renderPhotos(photos);
    status.textContent=date+' · 사진 '+photos.length+'장';
  }).catch(function(e){ if(!cached) status.textContent='⚠️ '+(e.message||e); });
}

// ---- 업로드 (자동 리사이즈/압축) ----
function prepImage(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var max=1920,w=img.naturalWidth,h=img.naturalHeight;
      var s=Math.min(1,max/Math.max(w,h));
      var nw=Math.max(1,Math.round(w*s)),nh=Math.max(1,Math.round(h*s));
      try{
        var c=document.createElement('canvas');c.width=nw;c.height=nh;
        c.getContext('2d').drawImage(img,0,0,nw,nh);
        c.toBlob(function(blob){ res(blob||file); },'image/jpeg',0.85);
      }catch(e){ res(file); }
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
function blobToB64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result.split(',')[1]);};fr.onerror=rej;fr.readAsDataURL(blob);});}
function addFiles(list){for(var i=0;i<list.length;i++){var f=list[i];if(f&&f.type.indexOf('image/')===0)pendingFiles.push(f);}renderPreview();}
function renderPreview(){
  var box=document.getElementById('upPreview');box.innerHTML='';
  if(!pendingFiles.length)return;
  pendingFiles.forEach(function(f,idx){var url=URL.createObjectURL(f);var d=document.createElement('div');d.className='thumb';d.innerHTML='<img src="'+url+'" /><button class="rm">✕</button>';d.querySelector('.rm').onclick=function(){pendingFiles.splice(idx,1);URL.revokeObjectURL(url);renderPreview();};box.appendChild(d);});
  var c=document.createElement('div');c.className='cnt';c.textContent=pendingFiles.length+'장 선택됨';box.appendChild(c);
}
function doUpload(){
  var date=document.getElementById('upDate').value;
  var member=document.getElementById('upMember').value;
  var memo=document.getElementById('upMemo').value.trim();
  if(!member){toast('담당자를 선택하세요');return;}
  if(!pendingFiles.length){toast('사진을 선택하거나 붙여넣으세요');return;}
  localStorage.setItem('ps_member',member);   // 담당자 기억
  var btn=document.getElementById('btnDoUpload');btn.disabled=true;
  var files=pendingFiles.slice();var i=0;
  function next(){
    if(i>=files.length){toast('업로드 완료! 알림 메일이 발송됩니다.');pendingFiles=[];renderPreview();closeOverlay('uploadOverlay');document.getElementById('datePicker').value=date;btn.disabled=false;btn.textContent='업로드';localStorage.removeItem('ps_list_'+date);render();return;}
    var file=files[i];i++;btn.textContent='업로드 중… ('+i+'/'+files.length+')';
    prepImage(file).then(blobToB64).then(function(b64){
      return apiPost({action:'upload',date:date,uploader:member,memo:memo,filename:pad(i)+'_'+member+'.jpg',mime:'image/jpeg',dataBase64:b64});
    }).then(function(){next();}).catch(function(e){toast('업로드 실패: '+(e.message||e));btn.disabled=false;btn.textContent='업로드';});
  }
  next();
}

// ---- 삭제 (비번 불필요) ----
function deletePhoto(p){
  if(!confirm('이 사진을 삭제할까요?'))return;
  apiPost({action:'delete',pw:SETTINGS_PW,fileId:p.fileId}).then(function(){
    var date=document.getElementById('datePicker').value;localStorage.removeItem('ps_list_'+date);
    toast('삭제됨');render();
  }).catch(function(e){toast('삭제 실패: '+(e.message||e));});
}

// ---- 뷰어 (transform 확대/축소 + 이동) ----
var viewerZoom=null;
function setupViewerZoom(){
  var body=document.getElementById('viewerBody');
  var z={scale:1,tx:0,ty:0,img:null};var pts={},pc=0,pd=0,ps=1;
  function vals(o){var a=[];for(var k in o)a.push(o[k]);return a;}
  function clamp(){
    if(!z.img)return;
    var cw=body.clientWidth,ch=body.clientHeight;
    var sw=z.img.offsetWidth*z.scale,sh=z.img.offsetHeight*z.scale;
    var mx=Math.max(0,(sw-cw)/2),my=Math.max(0,(sh-ch)/2);
    z.tx=Math.max(-mx,Math.min(mx,z.tx));z.ty=Math.max(-my,Math.min(my,z.ty));
  }
  function apply(anim){
    if(!z.img)return;
    z.img.style.transition=anim?'transform .15s ease':'none';
    z.img.style.transform='translate('+z.tx+'px,'+z.ty+'px) scale('+z.scale+')';
    z.img.style.cursor=z.scale>1?'grab':'default';
    document.getElementById('zoomPct').textContent=Math.round(z.scale*100)+'%';
  }
  function zoomAt(ns,cx,cy,anim){
    if(!z.img)return;
    ns=Math.max(1,Math.min(8,ns));
    var rect=body.getBoundingClientRect();var bcx=rect.left+rect.width/2,bcy=rect.top+rect.height/2;
    var gx=(cx==null?bcx:cx)-bcx,gy=(cy==null?bcy:cy)-bcy;
    z.tx=gx-(gx-z.tx)*(ns/z.scale);z.ty=gy-(gy-z.ty)*(ns/z.scale);
    z.scale=ns;clamp();apply(anim);
  }
  z.zoomBtn=function(f){zoomAt(z.scale*f,null,null,true);};
  z.reset=function(){z.scale=1;z.tx=0;z.ty=0;apply(true);};
  z.setImg=function(img){z.img=img;z.scale=1;z.tx=0;z.ty=0;apply(false);};
  body.addEventListener('wheel',function(e){if(!z.img)return;e.preventDefault();zoomAt(z.scale*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY,false);},{passive:false});
  body.addEventListener('dblclick',function(e){if(z.img)zoomAt(z.scale>1?1:2.5,e.clientX,e.clientY,true);});
  body.addEventListener('pointerdown',function(e){if(!z.img)return;try{body.setPointerCapture(e.pointerId);}catch(_){}pts[e.pointerId]={x:e.clientX,y:e.clientY};pc++;if(pc===2){var p=vals(pts);pd=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);ps=z.scale;}});
  body.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;var prev=pts[e.pointerId];pts[e.pointerId]={x:e.clientX,y:e.clientY};if(pc===2){var p=vals(pts);var d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);var mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;if(pd>0){e.preventDefault();zoomAt(ps*d/pd,mx,my,false);}}else if(pc===1&&z.scale>1){e.preventDefault();z.tx+=e.clientX-prev.x;z.ty+=e.clientY-prev.y;clamp();apply(false);}});
  function up(e){if(pts[e.pointerId]){delete pts[e.pointerId];pc--;}if(pc<2)pd=0;}
  body.addEventListener('pointerup',up);body.addEventListener('pointercancel',up);
  return z;
}
function openViewer(p){
  var v=document.getElementById('viewer');var body=document.getElementById('viewerBody');
  body.innerHTML='<div class="spin"></div>';
  if(!viewerZoom)viewerZoom=setupViewerZoom();
  document.getElementById('zoomPct').textContent='100%';
  document.getElementById('btnViewerDownload').onclick=function(){window.open(dlUrl(p.fileId),'_blank');};
  v.classList.add('show');
  var img=new Image();img.referrerPolicy='no-referrer';
  img.onload=function(){ body.innerHTML='';body.appendChild(img);viewerZoom.setImg(img); };
  img.onerror=function(){ body.innerHTML='<div style="color:#fff">이미지 로드 실패</div>'; };
  img.src=bigUrl(p.fileId);
}

// ---- 이벤트 ----
function shiftDate(days){var dp=document.getElementById('datePicker');var d=new Date(dp.value+'T00:00:00');d.setDate(d.getDate()+days);dp.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());render();}
document.getElementById('datePicker').value=todayStr();
document.getElementById('upDate').value=todayStr();
document.getElementById('btnPrev').onclick=function(){shiftDate(-1);};
document.getElementById('btnNext').onclick=function(){shiftDate(1);};
document.getElementById('btnToday').onclick=function(){document.getElementById('datePicker').value=todayStr();render();};
document.getElementById('datePicker').onchange=render;
document.getElementById('btnRefresh').onclick=function(){var d=document.getElementById('datePicker').value;localStorage.removeItem('ps_list_'+d);loadConfig().then(fillMemberSelect).then(render);};

document.getElementById('btnUpload').onclick=function(){document.getElementById('upDate').value=document.getElementById('datePicker').value;document.getElementById('upMemo').value='';document.getElementById('upFile').value='';pendingFiles=[];renderPreview();fillMemberSelect();openOverlay('uploadOverlay');};
document.getElementById('btnCancelUpload').onclick=function(){closeOverlay('uploadOverlay');};
document.getElementById('btnDoUpload').onclick=doUpload;
document.getElementById('upMember').onchange=function(){if(this.value)localStorage.setItem('ps_member',this.value);};
var upFileEl=document.getElementById('upFile');
document.getElementById('btnPick').onclick=function(){upFileEl.click();};
upFileEl.onchange=function(){addFiles(upFileEl.files);upFileEl.value='';};
document.getElementById('btnPaste').onclick=function(){
  if(navigator.clipboard&&navigator.clipboard.read){navigator.clipboard.read().then(function(items){var found=false;items.forEach(function(it){var t=it.types.filter(function(x){return x.indexOf('image/')===0;})[0];if(t){found=true;it.getType(t).then(function(b){addFiles([new File([b],'paste.png',{type:b.type})]);});}});toast(found?'붙여넣기 완료':'클립보드에 이미지가 없어요');}).catch(function(){toast('여기를 클릭하고 Ctrl+V 를 누르세요');});}
  else toast('여기를 클릭하고 Ctrl+V 를 누르세요');
};
document.addEventListener('paste',function(e){if(!document.getElementById('uploadOverlay').classList.contains('show'))return;var items=e.clipboardData&&e.clipboardData.items;if(!items)return;var found=false;for(var i=0;i<items.length;i++){var it=items[i];if(it.kind==='file'&&it.type.indexOf('image/')===0){addFiles([it.getAsFile()]);found=true;}}if(found){e.preventDefault();toast('붙여넣기 완료');}});
var pz=document.getElementById('pasteZone');
['dragenter','dragover'].forEach(function(ev){pz.addEventListener(ev,function(e){e.preventDefault();pz.classList.add('drag');});});
['dragleave','drop'].forEach(function(ev){pz.addEventListener(ev,function(e){e.preventDefault();pz.classList.remove('drag');});});
pz.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);});

document.getElementById('btnViewerClose').onclick=function(){document.getElementById('viewer').classList.remove('show');};
document.getElementById('btnZoomIn').onclick=function(){viewerZoom&&viewerZoom.zoomBtn(1.4);};
document.getElementById('btnZoomOut').onclick=function(){viewerZoom&&viewerZoom.zoomBtn(1/1.4);};
document.getElementById('btnZoomReset').onclick=function(){viewerZoom&&viewerZoom.reset();};

document.getElementById('btnSettings').onclick=function(){
  if(!settingsUnlocked){var pw=prompt('설정 비밀번호를 입력하세요');if(pw===null)return;if(pw!==SETTINGS_PW){toast('비밀번호가 틀렸습니다');return;}settingsUnlocked=true;window._pw=pw;}
  renderTags();openOverlay('settingsOverlay');
};
document.getElementById('btnCloseSettings').onclick=function(){closeOverlay('settingsOverlay');};
document.getElementById('btnAddMember').onclick=function(){var v=document.getElementById('newMember').value.trim();if(v&&cfg.members.indexOf(v)<0)cfg.members.push(v);document.getElementById('newMember').value='';renderTags();};
document.getElementById('newMember').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('btnAddMember').click();});
document.getElementById('btnAddEmail').onclick=function(){var v=document.getElementById('newEmail').value.trim();if(v&&/\S+@\S+\.\S+/.test(v)&&cfg.recipients.indexOf(v)<0)cfg.recipients.push(v);else if(v){toast('이메일 형식을 확인하세요');return;}document.getElementById('newEmail').value='';renderTags();};
document.getElementById('newEmail').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('btnAddEmail').click();});
document.getElementById('btnSaveConfig').onclick=function(){
  apiPost({action:'saveConfig',pw:window._pw||SETTINGS_PW,members:cfg.members,recipients:cfg.recipients})
    .then(function(c){cfg.members=c.members;cfg.recipients=c.recipients;lsSet('ps_config',cfg);fillMemberSelect();toast('저장 완료 (모두에게 공유됨)');})
    .catch(function(e){toast('저장 실패: '+(e.message||e));});
};

// ---- 테마(다크/일반) ----
function applyTheme(t){
  if(t==='light') document.body.classList.add('light'); else document.body.classList.remove('light');
  document.getElementById('btnTheme').textContent = (t==='light') ? '🌙' : '☀️';
  localStorage.setItem('ps_theme', t);
}
applyTheme(localStorage.getItem('ps_theme') || 'dark');
document.getElementById('btnTheme').onclick=function(){ applyTheme(document.body.classList.contains('light') ? 'dark' : 'light'); };

// ---- 시작 (캐시 즉시 → 서버 갱신) ----
var cc=lsGet('ps_config'); if(cc){cfg=cc;fillMemberSelect();}
render();
loadConfig().then(fillMemberSelect).catch(function(){});
</script>
